# Config for update_dependencies.py

# Directory to output the html sites
output_dir = "docs/static_notebooks"

# Directories to search for notebooks
notebook_dirs= [
    "dyscolab-tutorials/jablonski",
    "dyscolab-tutorials/poincare",
    "dyscolab-tutorials/simbio",
]

# Pixi environment the pre-push hook builds with, per branch.
# Branches not listed here skip the build.
[pre_push_envs]
main = "default"
dev = "local"
