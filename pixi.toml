[workspace]
authors = ["Oliverio Starosta <oliveriostarosta@gmail.com>"]
channels = ["conda-forge"]
name = "dyscolab_docs"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
zensical = "*"
matplotlib = "*"
numpy = "*"
ipykernel = "*"
ipywidgets = "*"
marimo = "*"

[pypi-dependencies]
simbio = ">=1.0.0b3"
poincare = ">=1.0.0b3"
jablonski = ">=0.2.0"
rebop = "*"

[tasks.update-static]
cmd = "git -C dyscolab-tutorials pull && python update_static.py"